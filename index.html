<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TALKIE-WALKIE MATRIX</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            overflow: hidden;
            background: #000;
            color: #0f0;
            font-family: 'VT323', monospace;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 10px;
        }

        #matrix {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            opacity: 0.85;
        }

        .overlay {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 360px;
            background: rgba(10, 10, 10, 0.92);
            border: 5px solid #0f0;
            border-radius: 12px;
            padding: 20px 18px;
            box-shadow: 0 0 50px #0f0;
            text-align: center;
            max-height: 100vh;
            overflow-y: auto;
        }

        h1 { font-size: 34px; margin-bottom: 8px; }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #111;
            border: 3px solid #0f0;
            color: #0f0;
            font-size: 22px;
            text-align: center;
        }

        button.small {
            background: #111;
            color: #0f0;
            border: 3px solid #0f0;
            padding: 9px 18px;
            margin: 6px;
            font-size: 19px;
        }

        #talkBtn {
            width: 100%;
            max-width: 240px;
            height: 110px;
            margin: 25px auto;
            background: rgba(200, 0, 0, 0.78);
            border: 6px solid #ddd;
            border-radius: 12px;
            color: white;
            font-size: 38px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow:
                0 10px 25px rgba(255,0,0,0.6),
                inset 0 8px 15px rgba(255,255,255,0.4),
                inset 0 -8px 15px rgba(0,0,0,0.6);
        }

        #talkBtn:active {
            background: rgba(0, 255, 0, 0.85);
            color: #000;
            border-color: #0f0;
            transform: scale(0.96);
        }

        #status { font-size: 22px; min-height: 45px; }

        .connected-list {
            background: #111;
            border: 3px solid #0f0;
            padding: 10px;
            max-height: 130px;
            overflow-y: auto;
            font-size: 19px;
        }

        .info { font-size: 15px; color: #0a0; margin-top: 15px; }
    </style>
</head>

<body>

<canvas id="matrix"></canvas>

<div class="overlay">
    <h1>P2P CALL</h1>

    <input type="text" id="myId" readonly>
    <button onclick="copyMyId()" class="small">COPIER MON ID</button>

    <input type="text" id="friendId" placeholder="ID de l'ami">
    <button onclick="connectToFriend()" class="small">SE CONNECTER À L'AMI</button>

    <div style="margin-top:12px;">Connectés :</div>
    <div id="connectedList" class="connected-list"></div>

    <button id="talkBtn">PUSH</button>

    <div id="status">En attente...</div>

    <div class="info">
        Audio P2P - push to talk
    </div>
</div>

<script>
/* MATRIX */
const canvas = document.getElementById('matrix');
const ctx = canvas.getContext('2d');
function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; }
window.addEventListener('resize', resize);
resize();

const chars = "01アイウエオカキクケコ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
let drops = Array(Math.floor(canvas.width / 16)).fill(1);

setInterval(() => {
    ctx.fillStyle = 'rgba(0,0,0,0.06)';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = '#0f0';
    ctx.font = '16px VT323';

    for(let i=0;i<drops.length;i++){
        const t = chars[Math.floor(Math.random()*chars.length)];
        ctx.fillText(t,i*16,drops[i]*16);
        if(drops[i]*16>canvas.height && Math.random()>0.975) drops[i]=0;
        drops[i]++;
    }
},35);

/* PEER */
let peer;
let connections = [];
let localStream = null;
let mediaRecorder;
let audioChunks = [];

const myIdEl = document.getElementById('myId');
const statusEl = document.getElementById('status');
const talkBtn = document.getElementById('talkBtn');
const connectedListEl = document.getElementById('connectedList');

function initPeer(){
    peer = new Peer();

    peer.on('open', id => {
        myIdEl.value = id;
        statusEl.textContent = "ID prêt";
    });

    peer.on('connection', conn => addConnection(conn));
}

function addConnection(conn){
    conn.on('open', () => {
        connections.push(conn);
        updateList();
    });

    conn.on('data', data => {
        if(data.type === 'audio'){
            const blob = new Blob([data.blob], {type:'audio/webm'});
            new Audio(URL.createObjectURL(blob)).play();
        }
    });

    conn.on('close', () => {
        connections = connections.filter(c=>c!==conn);
        updateList();
    });
}

function updateList(){
    connectedListEl.innerHTML =
        connections.length ?
        connections.map(c=>`→ ${c.peer}`).join('<br>') :
        "Aucun";
}

function copyMyId(){
    myIdEl.select();
    document.execCommand('copy');
    alert("ID copié");
}

function connectToFriend(){
    const id = friendId.value.trim();
    if(!id) return alert("ID manquant");
    const conn = peer.connect(id);
    addConnection(conn);
}

/* AUDIO */
async function startTalking(){
    if(connections.length===0) return;

    if(!localStream){
        localStream = await navigator.mediaDevices.getUserMedia({audio:true});
    }

    audioChunks = [];

    mediaRecorder = new MediaRecorder(localStream);

    mediaRecorder.ondataavailable = e => {
        if(e.data.size>0) audioChunks.push(e.data);
    };

    mediaRecorder.start();
}

function stopTalking(){
    if(!mediaRecorder) return;

    mediaRecorder.onstop = () => {
        const blob = new Blob(audioChunks,{type:'audio/webm'});

        connections.forEach(c=>{
            if(c.open){
                c.send({type:'audio', blob});
            }
        });

        statusEl.textContent = "Envoyé";
    };

    mediaRecorder.stop();
}

/* ✅ CORRECTION IMPORTANT BOUTON (FIX BUG ANDROID / A7) */

let isTalking = false;

function press(e){
    e.preventDefault();
    if(isTalking) return;
    isTalking = true;
    startTalking();
}

function release(e){
    e.preventDefault();
    if(!isTalking) return;
    isTalking = false;
    stopTalking();
}

talkBtn.addEventListener('pointerdown', press);
talkBtn.addEventListener('pointerup', release);
talkBtn.addEventListener('pointercancel', release);
talkBtn.addEventListener('pointerleave', release);

/* INIT */
window.onload = initPeer;
</script>

</body>
</html>
