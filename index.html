<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRYPT - Talkie-Walkie</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            overflow: hidden;
            background: #000;
            color: #0f0;
            font-family: 'VT323', monospace;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 10px;
        }

        #matrix {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            opacity: 0.85;
        }

        .overlay {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 360px;
            background: rgba(10, 10, 10, 0.92);
            border: 5px solid #0f0;
            border-radius: 12px;
            padding: 20px 18px;
            box-shadow: 0 0 50px #0f0;
            text-align: center;
            max-height: 100vh;
            overflow-y: auto;
        }

        h1 { font-size: 34px; margin-bottom: 8px; }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #111;
            border: 3px solid #0f0;
            color: #0f0;
            font-size: 22px;
            text-align: center;
        }

        button.small {
            background: #111;
            color: #0f0;
            border: 3px solid #0f0;
            padding: 9px 18px;
            margin: 6px;
            font-size: 19px;
        }

        #talkBtn {
            width: 100%;
            max-width: 240px;
            height: 110px;
            margin: 25px auto;
            background: rgba(200, 0, 0, 0.78);
            border: 6px solid #ddd;
            border-radius: 12px;
            color: white;
            font-size: 38px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow:
                0 10px 25px rgba(255,0,0,0.6),
                inset 0 8px 15px rgba(255,255,255,0.4),
                inset 0 -8px 15px rgba(0,0,0,0.6);
        }

        #talkBtn:active {
            background: rgba(0, 255, 0, 0.85);
            color: #000;
            border-color: #0f0;
            transform: scale(0.96);
        }

        #status { font-size: 22px; min-height: 45px; }

        .connected-list {
            background: #111;
            border: 3px solid #0f0;
            padding: 10px;
            max-height: 130px;
            overflow-y: auto;
            font-size: 19px;
        }

        .info { font-size: 15px; color: #0a0; margin-top: 15px; }
    </style>
</head>
<body>

<canvas id="matrix"></canvas>

<div class="overlay">
    <h1>CRYPT</h1>

    <input type="text" id="roomName" placeholder="Nom de la salle (ex: toto)">
    <button onclick="joinRoom()" class="small">REJOINDRE</button>

    <div style="margin-top:12px;">Connectés :</div>
    <div id="connectedList" class="connected-list"></div>

    <button id="talkBtn"></button>

    <div id="status">Prêt</div>

    <div class="info">
        Talkie-Walkie - Maintiens le bouton pour parler
    </div>
</div>

<script>
// MATRIX - inchangé
const canvas = document.getElementById('matrix');
const ctx = canvas.getContext('2d');
function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; }
window.addEventListener('resize', resize);
resize();

const chars = "01アイウエオカキクケコ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
let drops = Array(Math.floor(canvas.width / 16)).fill(1);

setInterval(() => {
    ctx.fillStyle = 'rgba(0,0,0,0.06)';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = '#0f0';
    ctx.font = '16px VT323';

    for(let i=0;i<drops.length;i++){
        const t = chars[Math.floor(Math.random()*chars.length)];
        ctx.fillText(t,i*16,drops[i]*16);
        if(drops[i]*16>canvas.height && Math.random()>0.975) drops[i]=0;
        drops[i]++;
    }
},35);

// ====================== LOGIQUE ======================
let peer;
let connections = [];
let localStream = null;
let mediaRecorder;
let audioChunks = [];
let isHost = false;

const statusEl = document.getElementById('status');
const connectedListEl = document.getElementById('connectedList');
const talkBtn = document.getElementById('talkBtn');

function joinRoom() {
    const room = document.getElementById('roomName').value.trim();
    if (!room) return statusEl.textContent = "Entre un nom de salle";

    if (peer) {
        connections.forEach(conn => { try { conn.close(); } catch(e){} });
        peer.destroy();
        connections = [];
    }

    statusEl.textContent = "Connexion...";

    peer = new Peer(room, {
        debug: 2,
        config: {
            iceServers: [
                { urls: "stun:stun.l.google.com:19302" },
                { urls: "stun:stun1.l.google.com:19302" }
            ]
        }
    });

    peer.on('open', () => {
        isHost = true;
        statusEl.textContent = `Hôte - Salle "${room}"`;
    });

    peer.on('connection', (conn) => addConnection(conn));

    peer.on('error', (err) => {
        console.error(err);
        if (err.type === 'unavailable-id') {
            statusEl.textContent = "Salle prise → mode client";
            const clientId = room + '_' + Math.random().toString(36).substr(2,8);
            peer = new Peer(clientId, { debug: 2 });
            peer.on('open', () => {
                const conn = peer.connect(room);
                addConnection(conn);
            });
        } else {
            statusEl.textContent = "Erreur : " + err.type;
        }
    });
}

function addConnection(conn) {
    conn.on('open', () => {
        if (!connections.find(c => c.peer === conn.peer)) {
            connections.push(conn);
            updateList();
            statusEl.textContent = connections.length + " connecté" + (connections.length > 1 ? "s" : "");
        }
    });

    conn.on('data', (data) => {
        if (data.type === 'audio' && data.blob) {
            const blob = new Blob([data.blob], {type: 'audio/webm'});
            const audio = new Audio(URL.createObjectURL(blob));
            audio.play();

            if (isHost) {
                connections.forEach(c => {
                    if (c !== conn && c.open) c.send(data);
                });
            }
        }
    });

    conn.on('close', () => {
        connections = connections.filter(c => c !== conn);
        updateList();
    });
}

function updateList() {
    connectedListEl.innerHTML = connections.length === 0 ? "Aucun" : connections.map(c => `→ ${c.peer}`).join('<br>');
}

// Push to talk
async function startTalking() {
    if (connections.length === 0) return statusEl.textContent = "Personne connecté";
    if (!localStream) {
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        } catch(e) {
            return statusEl.textContent = "Micro inaccessible";
        }
    }
    audioChunks = [];
    mediaRecorder = new MediaRecorder(localStream, { mimeType: 'audio/webm' });
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.start(100);
}

function stopTalking() {
    if (!mediaRecorder) return;
    mediaRecorder.onstop = () => {
        if (audioChunks.length === 0) return;
        const blob = new Blob(audioChunks, { type: 'audio/webm' });
        connections.forEach(conn => {
            if (conn.open) conn.send({ type: 'audio', blob: blob });
        });
        statusEl.textContent = "Envoyé";
    };
    mediaRecorder.stop();
}

let isTalking = false;
function press(e) { e.preventDefault(); if (!isTalking) { isTalking = true; startTalking(); } }
function release(e) { e.preventDefault(); if (isTalking) { isTalking = false; stopTalking(); } }

talkBtn.addEventListener('pointerdown', press);
talkBtn.addEventListener('pointerup', release);
talkBtn.addEventListener('pointerleave', release);
talkBtn.addEventListener('pointercancel', release);

window.addEventListener('beforeunload', () => {
    if (localStream) localStream.getTracks().forEach(t => t.stop());
    if (peer) peer.destroy();
});
</script>
</body>
</html>
