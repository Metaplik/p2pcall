<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>CRYPT</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
body {
    margin:0;
    background:black;
    color:#0f0;
    font-family: monospace;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
    padding:10px;
    box-sizing:border-box;
}

canvas {
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:0;
}

* {
    -webkit-user-select:none;
    user-select:none;
    -webkit-tap-highlight-color: transparent;
}

.box {
    position:relative;
    z-index:1;
    width:100%;
    max-width:300px;
    background:rgba(0,0,0,0.95);
    border:2px solid #0f0;
    border-radius:12px;
    padding:12px;
    text-align:center;
    box-sizing:border-box;
}

h2 {
    margin:0 0 8px;
    font-size:18px;
}

input, button {
    width:100%;
    height:40px;
    margin:4px 0;
    padding:0 8px;
    background:#111;
    border:1.5px solid #0f0;
    color:#0f0;
    font-size:14px;
    text-align:center;
    border-radius:6px;
    box-sizing:border-box;
}

#status {
    margin-top:6px;
    font-size:11px;
    padding:3px;
}

#talk {
    width:80px;
    height:80px;
    margin:10px auto;
    border-radius:50%;
    border:none;
    cursor:pointer;
    background:radial-gradient(circle at 30% 30%, #ff4d4d, #cc0000);
    box-shadow: 0 0 20px rgba(255,0,0,0.6), inset 0 0 15px rgba(255,255,255,0.2);
}

#talk:active {
    transform:scale(0.95);
}

.sms-area {
    margin-top:10px;
    border-top:1px solid #0f0;
    padding-top:8px;
}

.sms-box {
    background:#000;
    border:1px solid #0f0;
    border-radius:6px;
    height:100px;
    overflow-y:auto;
    padding:5px;
    margin-bottom:6px;
    text-align:left;
    font-size:11px;
}

.sms-input {
    display:flex;
    gap:5px;
}

.sms-input input {
    flex:1;
    height:35px;
    font-size:12px;
    margin:0;
    padding:0 5px;
}

.sms-input button {
    width:55px;
    height:35px;
    margin:0;
    font-size:11px;
    padding:0;
}

.msg {
    margin-bottom:4px;
    word-wrap:break-word;
}

.msg span {
    color:#ff0;
}

.msg.me {
    color:#0f0;
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div class="box">

<h2>CRYPT</h2>

<input id="room" placeholder="code">
<button onclick="joinRoom()">ENTRER</button>

<div id="status"></div>

<div class="sms-area">
    <div class="sms-box" id="smsBox"></div>
    <div class="sms-input">
        <input type="text" id="smsInput" placeholder="message">
        <button onclick="sendSMS()">OK</button>
    </div>
</div>

<button id="talk"></button>

</div>

<script>
const c = document.getElementById("matrix");
const ctx = c.getContext("2d");
c.width = window.innerWidth;
c.height = window.innerHeight;

let letters = "01CRYPT".split("");
let font = 12;
let cols = Math.floor(c.width / font);
let drops = [];

for(let i = 0; i < cols; i++) drops[i] = 1;

function draw(){
    ctx.fillStyle = "rgba(0,0,0,0.05)";
    ctx.fillRect(0, 0, c.width, c.height);
    ctx.fillStyle = "#0f0";
    ctx.font = font + "px monospace";

    for(let i = 0; i < drops.length; i++){
        let text = letters[Math.floor(Math.random()*letters.length)];
        ctx.fillText(text, i * font, drops[i] * font);

        if(drops[i] * font > c.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
    }
}
setInterval(draw,33);

let peer;
let connections = [];
let currentRoom = null;
let stream = null;
let mediaRecorder = null;
let isTalking = false;

function joinRoom() {
    const roomInput = document.getElementById("room");
    const roomName = roomInput.value.trim();
    
    if (!roomName) return;
    
    if (peer) {
        connections.forEach(conn => {
            if (conn && conn.close) conn.close();
        });
        connections = [];
        peer.destroy();
    }
    
    currentRoom = roomName;
    
    const peerId = roomName + "_" + Math.random().toString(36).substr(2, 6);
    
    peer = new Peer(peerId);
    
    peer.on('open', () => {
        document.getElementById("status").innerText = "connecté";
        
        setTimeout(() => {
            connectToRoom(roomName);
        }, 500);
    });
    
    peer.on('connection', (conn) => {
        handleNewConnection(conn);
    });
    
    peer.on('error', (err) => {
        if (err.type === 'peer-unavailable') {
            document.getElementById("status").innerText = "erreur";
        }
    });
}

function connectToRoom(roomName) {
    setTimeout(() => {
        if (connections.length === 0) {
            document.getElementById("status").innerText = "en attente";
        }
    }, 1000);
}

function handleNewConnection(conn) {
    conn.on('open', () => {
        const exists = connections.some(c => c.peer === conn.peer);
        if (!exists) {
            connections.push(conn);
            document.getElementById("status").innerText = connections.length + " connecté(s)";
        }
        
        setupConnection(conn);
    });
    
    conn.on('close', () => {
        const index = connections.findIndex(c => c.peer === conn.peer);
        if (index !== -1) {
            connections.splice(index, 1);
            document.getElementById("status").innerText = connections.length + " connecté(s)";
        }
    });
}

function setupConnection(conn) {
    conn.on('data', (data) => {
        if (data.type === 'sms') {
            addSMS("autre", data.message);
        } else if (data.type === 'audio' && data.blob) {
            playAudio(data.blob);
        }
    });
}

function sendSMS() {
    const input = document.getElementById("smsInput");
    const message = input.value.trim();
    
    if (!message) return;
    
    if (!currentRoom) return;
    
    addSMS("moi", message);
    
    connections.forEach(conn => {
        if (conn.open) {
            conn.send({
                type: 'sms',
                message: message
            });
        }
    });
    
    input.value = "";
}

function addSMS(sender, message) {
    const box = document.getElementById("smsBox");
    const div = document.createElement("div");
    div.className = "msg";
    if (sender === "moi") {
        div.classList.add("me");
        div.innerHTML = `<span>moi:</span> ${message}`;
    } else {
        div.innerHTML = `<span>autre:</span> ${message}`;
    }
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
}

const talkButton = document.getElementById("talk");

talkButton.addEventListener("touchstart", startTalking);
talkButton.addEventListener("touchend", stopTalking);
talkButton.addEventListener("mousedown", startTalking);
talkButton.addEventListener("mouseup", stopTalking);

async function startTalking(e) {
    e.preventDefault();
    if (isTalking) return;
    
    if (!currentRoom) return;
    
    try {
        if (!stream) {
            stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        }
        
        isTalking = true;
        mediaRecorder = new MediaRecorder(stream);
        
        mediaRecorder.ondataavailable = (event) => {
            if (event.data.size > 0 && connections.length > 0) {
                connections.forEach(conn => {
                    if (conn.open) {
                        conn.send({
                            type: 'audio',
                            blob: event.data
                        });
                    }
                });
            }
        };
        
        mediaRecorder.start(100);
        
    } catch (err) {
        isTalking = false;
    }
}

function stopTalking(e) {
    e.preventDefault();
    if (!isTalking) return;
    
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
    }
    
    isTalking = false;
}

function playAudio(blob) {
    try {
        const audioUrl = URL.createObjectURL(blob);
        const audio = new Audio(audioUrl);
        audio.onended = () => URL.revokeObjectURL(audioUrl);
        audio.play();
    } catch (err) {}
}

window.addEventListener('beforeunload', () => {
    if (peer) {
        peer.destroy();
    }
    if (stream) {
        stream.getTracks().forEach(track => track.stop());
    }
});
</script>

</body>
</html>
