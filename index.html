<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P2P CALL</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
body {
    margin:0;
    background:black;
    color:#0f0;
    font-family: monospace;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

/* MATRIX */
canvas {
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:0;
}

/* BOX */
.box {
    position:relative;
    z-index:1;
    width:92%;
    max-width:320px;
    background:rgba(0,0,0,0.9);
    border:2px solid #0f0;
    border-radius:12px;
    padding:14px;
    text-align:center;
    box-sizing:border-box;
}

h2 {
    margin:5px 0 10px;
}

/* INPUTS + BUTTONS */
input, button {
    width:100%;
    height:42px;
    margin:5px 0;
    padding:0 10px;
    background:#111;
    border:2px solid #0f0;
    color:#0f0;
    font-size:15px;
    text-align:center;
    border-radius:6px;
    box-sizing:border-box;
}

/* STATUS */
#status {
    margin-top:8px;
    font-size:13px;
}

/* TALK BUTTON */
#talk {
    width:110px;
    height:110px;
    margin:15px auto;
    border-radius:50%;
    border:none;
    cursor:pointer;

    /* bouton rouge propre sans image (100% fiable) */
    background:radial-gradient(circle at 30% 30%, #ff4d4d, #cc0000);

    box-shadow:
        0 0 25px rgba(255,0,0,0.8),
        inset 0 0 20px rgba(255,255,255,0.3);
}

#talk:active {
    transform:scale(0.9);
    box-shadow:
        0 0 10px rgba(255,0,0,1),
        inset 0 0 30px rgba(0,0,0,0.6);
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div class="box">

<h2>P2P CALL</h2>

<input id="room" placeholder="Code / clé">
<button onclick="create()">CRÉER</button>

<input id="myId" readonly placeholder="Ton ID">

<input id="friend" placeholder="ID de l'ami">
<button onclick="connect()">CONNECTER</button>

<div id="status">En attente...</div>

<button id="talk"></button>

</div>

<script>
// MATRIX
const c = document.getElementById("matrix");
const ctx = c.getContext("2d");
c.width = innerWidth;
c.height = innerHeight;

let letters = "01P2P".split("");
let font = 14;
let cols = c.width / font;
let drops = [];

for(let i=0;i<cols;i++) drops[i]=1;

function draw(){
    ctx.fillStyle="rgba(0,0,0,0.05)";
    ctx.fillRect(0,0,c.width,c.height);

    ctx.fillStyle="#0f0";
    ctx.font=font+"px monospace";

    for(let i=0;i<drops.length;i++){
        let text = letters[Math.floor(Math.random()*letters.length)];
        ctx.fillText(text,i*font,drops[i]*font);

        if(drops[i]*font>c.height && Math.random()>0.975) drops[i]=0;
        drops[i]++;
    }
}
setInterval(draw,33);

// PEER
let peer;
let connections = [];
let stream;
let recorder;
let chunks = [];

function create(){
    const room = document.getElementById("room").value.trim();
    if(!room) return alert("entre un code");

    const id = room + "_" + Math.floor(Math.random()*10000);
    peer = new Peer(id);

    peer.on("open", id=>{
        document.getElementById("myId").value = id;
        document.getElementById("status").innerText = "ID prêt";
    });

    peer.on("connection", conn=>{
        setup(conn);
    });
}

function connect(){
    const id = document.getElementById("friend").value.trim();
    if(!id) return;

    const conn = peer.connect(id);
    setup(conn);
}

function setup(conn){
    conn.on("open", ()=>{
        connections.push(conn);
        document.getElementById("status").innerText = "connecté ("+connections.length+")";
    });

    conn.on("data", data=>{
        const blob = new Blob([data], {type:"audio/webm"});
        new Audio(URL.createObjectURL(blob)).play();
    });
}

// TALK BUTTON
const talk = document.getElementById("talk");

talk.onmousedown = start;
talk.onmouseup = stop;
talk.ontouchstart = e=>{e.preventDefault();start()};
talk.ontouchend = e=>{e.preventDefault();stop()};

async function start(){
    if(connections.length==0){
        document.getElementById("status").innerText="connecte toi";
        return;
    }

    if(!stream){
        stream = await navigator.mediaDevices.getUserMedia({audio:true});
    }

    chunks=[];
    recorder = new MediaRecorder(stream);

    recorder.ondataavailable = e=>chunks.push(e.data);
    recorder.start(100);
}

function stop(){
    if(!recorder) return;

    recorder.stop();

    recorder.onstop = ()=>{
        const blob = new Blob(chunks,{type:"audio/webm"});
        connections.forEach(c=>{
            if(c.open) c.send(blob);
        });
    }
}
</script>

</body>
</html>
