<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>CRYPT</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
body {
    margin:0;
    background:black;
    color:#0f0;
    font-family: monospace;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
    padding:10px;
    box-sizing:border-box;
}

canvas {
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:0;
}

* {
    -webkit-user-select:none;
    user-select:none;
    -webkit-tap-highlight-color: transparent;
}

.box {
    position:relative;
    z-index:1;
    width:100%;
    max-width:300px;
    background:rgba(0,0,0,0.95);
    border:2px solid #0f0;
    border-radius:12px;
    padding:12px;
    text-align:center;
    box-sizing:border-box;
}

h2 {
    margin:0 0 8px;
    font-size:18px;
}

input, button {
    width:100%;
    height:40px;
    margin:4px 0;
    padding:0 8px;
    background:#111;
    border:1.5px solid #0f0;
    color:#0f0;
    font-size:14px;
    text-align:center;
    border-radius:6px;
    box-sizing:border-box;
}

#status {
    margin-top:6px;
    font-size:11px;
    padding:3px;
}

#talk {
    width:80px;
    height:80px;
    margin:10px auto;
    border-radius:50%;
    border:none;
    cursor:pointer;
    background:radial-gradient(circle at 30% 30%, #ff4d4d, #cc0000);
    box-shadow: 0 0 20px rgba(255,0,0,0.6), inset 0 0 15px rgba(255,255,255,0.2);
}

#talk:active {
    transform:scale(0.95);
}

.sms-area {
    margin-top:10px;
    border-top:1px solid #0f0;
    padding-top:8px;
}

.sms-box {
    background:#000;
    border:1px solid #0f0;
    border-radius:6px;
    height:100px;
    overflow-y:auto;
    padding:5px;
    margin-bottom:6px;
    text-align:left;
    font-size:11px;
}

.sms-input {
    display:flex;
    gap:5px;
}

.sms-input input {
    flex:1;
    height:35px;
    font-size:12px;
    margin:0;
    padding:0 5px;
}

.sms-input button {
    width:55px;
    height:35px;
    margin:0;
    font-size:11px;
    padding:0;
}

.msg {
    margin-bottom:4px;
    word-wrap:break-word;
}

.msg span {
    color:#ff0;
}

.msg.me {
    color:#0f0;
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div class="box">

<h2>CRYPT</h2>

<input id="room" placeholder="code">
<button onclick="joinRoom()">ENTRER</button>

<div id="status"></div>

<div class="sms-area">
    <div class="sms-box" id="smsBox"></div>
    <div class="sms-input">
        <input type="text" id="smsInput" placeholder="message">
        <button onclick="sendSMS()">OK</button>
    </div>
</div>

<button id="talk"></button>

</div>

<script>
// MATRIX
const c = document.getElementById("matrix");
const ctx = c.getContext("2d");
c.width = window.innerWidth;
c.height = window.innerHeight;

let letters = "01CRYPT".split("");
let font = 12;
let cols = Math.floor(c.width / font);
let drops = [];

for(let i = 0; i < cols; i++) drops[i] = 1;

function draw(){
    ctx.fillStyle = "rgba(0,0,0,0.05)";
    ctx.fillRect(0, 0, c.width, c.height);
    ctx.fillStyle = "#0f0";
    ctx.font = font + "px monospace";

    for(let i = 0; i < drops.length; i++){
        let text = letters[Math.floor(Math.random()*letters.length)];
        ctx.fillText(text, i * font, drops[i] * font);

        if(drops[i] * font > c.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
    }
}
setInterval(draw,33);

// ===== SYSTEME P2P SIMPLE QUI MARCHE =====
let peer;
let connections = [];
let currentRoom = "";
let localStream = null;
let mediaRecorder = null;
let isTalking = false;

function joinRoom() {
    const roomName = document.getElementById("room").value.trim();
    if (!roomName) return;
    
    currentRoom = roomName;
    
    // Fermer l'ancien peer si existant
    if (peer) {
        peer.destroy();
        connections = [];
    }
    
    // Créer un nouveau peer avec l'ID = le nom de la room
    // Comme ça tout le monde avec le même nom se connecte automatiquement
    peer = new Peer(roomName);
    
    peer.on("open", () => {
        document.getElementById("status").innerText = "connecté";
    });
    
    peer.on("error", (err) => {
        // Si l'ID est déjà pris, on se connecte en tant que client
        if (err.type === "peer-unavailable" || err.type === "ID taken") {
            connectToRoom(roomName);
        } else {
            document.getElementById("status").innerText = "erreur";
        }
    });
    
    peer.on("connection", (conn) => {
        addConnection(conn);
    });
}

function connectToRoom(roomName) {
    // Se connecter à la room existante
    const conn = peer.connect(roomName);
    if (conn) {
        addConnection(conn);
    }
    document.getElementById("status").innerText = "connexion...";
}

function addConnection(conn) {
    conn.on("open", () => {
        connections.push(conn);
        document.getElementById("status").innerText = connections.length + " connecté(s)";
    });
    
    conn.on("data", (data) => {
        if (data.type === "sms") {
            addSMS("autre", data.msg);
        } else if (data.type === "audio" && data.blob) {
            const audio = new Audio(URL.createObjectURL(data.blob));
            audio.play();
        }
    });
    
    conn.on("close", () => {
        connections = connections.filter(c => c !== conn);
        document.getElementById("status").innerText = connections.length + " connecté(s)";
    });
}

// SMS
function sendSMS() {
    const input = document.getElementById("smsInput");
    const msg = input.value.trim();
    if (!msg) return;
    
    addSMS("moi", msg);
    
    connections.forEach(conn => {
        if (conn.open) {
            conn.send({ type: "sms", msg: msg });
        }
    });
    
    input.value = "";
}

function addSMS(sender, msg) {
    const box = document.getElementById("smsBox");
    const div = document.createElement("div");
    div.className = "msg";
    if (sender === "moi") {
        div.classList.add("me");
        div.innerHTML = `<span>moi:</span> ${msg}`;
    } else {
        div.innerHTML = `<span>autre:</span> ${msg}`;
    }
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
}

// TALKIE-WALKIE
const talkBtn = document.getElementById("talk");

talkBtn.addEventListener("mousedown", startTalk);
talkBtn.addEventListener("mouseup", stopTalk);
talkBtn.addEventListener("touchstart", startTalk);
talkBtn.addEventListener("touchend", stopTalk);

async function startTalk(e) {
    e.preventDefault();
    if (isTalking) return;
    
    if (!peer) {
        return;
    }
    
    try {
        if (!localStream) {
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        }
        
        isTalking = true;
        mediaRecorder = new MediaRecorder(localStream);
        
        mediaRecorder.ondataavailable = (event) => {
            if (event.data.size > 0 && connections.length > 0) {
                connections.forEach(conn => {
                    if (conn.open) {
                        conn.send({ type: "audio", blob: event.data });
                    }
                });
            }
        };
        
        mediaRecorder.start(100);
    } catch(e) {
        isTalking = false;
    }
}

function stopTalk(e) {
    e.preventDefault();
    if (!isTalking) return;
    
    if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
    }
    isTalking = false;
}

// Nettoyage
window.addEventListener("beforeunload", () => {
    if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
    }
    if (peer) {
        peer.destroy();
    }
});
</script>

</body>
</html>
