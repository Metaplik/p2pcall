<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>P2P CALL</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
body {
    margin:0;
    background:black;
    color:#0f0;
    font-family: monospace;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
    padding:10px;
    box-sizing:border-box;
}

canvas {
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:0;
}

.box {
    position:relative;
    z-index:1;
    width:100%;
    max-width:300px;
    background:rgba(0,0,0,0.95);
    border:2px solid #0f0;
    border-radius:12px;
    padding:12px;
    text-align:center;
    box-sizing:border-box;
}

h2 { margin:0 0 8px; font-size:18px; }

input, button {
    width:100%;
    height:40px;
    margin:4px 0;
    padding:0 8px;
    background:#111;
    border:1.5px solid #0f0;
    color:#0f0;
    font-size:14px;
    text-align:center;
    border-radius:6px;
    box-sizing:border-box;
}

#status {
    margin-top:6px;
    font-size:11px;
    padding:3px;
}

#talk {
    width:80px;
    height:80px;
    margin:10px auto;
    border-radius:50%;
    border:none;
    cursor:pointer;
    background:radial-gradient(circle at 30% 30%, #ff4d4d, #cc0000);
    box-shadow: 0 0 20px rgba(255,0,0,0.6), inset 0 0 15px rgba(255,255,255,0.2);
}

#talk:active { transform:scale(0.95); }

.sms-area {
    margin-top:10px;
    border-top:1px solid #0f0;
    padding-top:8px;
}

.sms-box {
    background:#000;
    border:1px solid #0f0;
    border-radius:6px;
    height:100px;
    overflow-y:auto;
    padding:5px;
    margin-bottom:6px;
    text-align:left;
    font-size:11px;
}

.sms-input {
    display:flex;
    gap:5px;
}

.sms-input input {
    flex:1;
    height:35px;
    font-size:12px;
    margin:0;
}

.sms-input button {
    width:55px;
    height:35px;
    margin:0;
    font-size:11px;
}

.msg { margin-bottom:4px; word-wrap:break-word; }
.msg span { color:#ff0; }
.msg.me { color:#0f0; }
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div class="box">

<h2>P2P CALL</h2>

<input id="room" placeholder="Nom (ex: team)">
<button onclick="joinRoom()">ENTRER</button>

<div id="status">En attente...</div>

<div class="sms-area">
    <div class="sms-box" id="smsBox"></div>
    <div class="sms-input">
        <input type="text" id="smsInput" placeholder="Message">
        <button onclick="sendSMS()">OK</button>
    </div>
</div>

<button id="talk"></button>

</div>

<script>
// MATRIX
const c = document.getElementById("matrix");
const ctx = c.getContext("2d");
c.width = window.innerWidth;
c.height = window.innerHeight;

let letters = "01P2P".split("");
let font = 12;
let cols = Math.floor(c.width / font);
let drops = [];

for(let i = 0; i < cols; i++) drops[i] = 1;

function draw(){
    ctx.fillStyle = "rgba(0,0,0,0.05)";
    ctx.fillRect(0, 0, c.width, c.height);
    ctx.fillStyle = "#0f0";
    ctx.font = font + "px monospace";

    for(let i = 0; i < drops.length; i++){
        let text = letters[Math.floor(Math.random()*letters.length)];
        ctx.fillText(text, i * font, drops[i] * font);

        if(drops[i] * font > c.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
    }
}
setInterval(draw,33);

// PEER ROOM
let peer;
let connections = [];

function joinRoom(){
    const room = document.getElementById("room").value.trim();
    if(!room) return;

    peer = new Peer(room);

    peer.on("open", ()=>{
        document.getElementById("status").innerText = "ROOM créée";
    });

    peer.on("error", ()=>{
        const id = room + "_" + Math.floor(Math.random()*10000);
        peer = new Peer(id);

        peer.on("open", ()=>{
            const conn = peer.connect(room);
            setup(conn);
            document.getElementById("status").innerText = "connecté";
        });

        peer.on("connection", conn=>setup(conn));
    });

    peer.on("connection", conn=>setup(conn));
}

function setup(conn){
    conn.on("open", ()=>{
        connections.push(conn);
        document.getElementById("status").innerText = "connecté ("+connections.length+")";
    });

    conn.on("data", data=>{
        if(data.type==="sms"){
            addSMS("Ami", data.msg);
        }
        if(data.type==="audio"){
            new Audio(URL.createObjectURL(data.blob)).play();
        }
    });
}

// SMS
function sendSMS(){
    const input = document.getElementById("smsInput");
    const msg = input.value.trim();
    if(!msg) return;

    addSMS("Moi", msg);

    connections.forEach(c=>{
        if(c.open){
            c.send({type:"sms", msg});
        }
    });

    input.value="";
}

function addSMS(sender, msg){
    const box = document.getElementById("smsBox");
    const div = document.createElement("div");
    div.className = "msg";
    if(sender==="Moi") div.classList.add("me");
    div.innerHTML = `<span>${sender}:</span> ${msg}`;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
}

// AUDIO
let stream, recorder, chunks=[];

const talk = document.getElementById("talk");

talk.onpointerdown=start;
talk.onpointerup=stop;

async function start(){
    if(connections.length===0) return;

    if(!stream){
        stream = await navigator.mediaDevices.getUserMedia({audio:true});
    }

    chunks=[];
    recorder=new MediaRecorder(stream);
    recorder.ondataavailable=e=>chunks.push(e.data);
    recorder.start();
}

function stop(){
    if(!recorder) return;

    recorder.stop();

    recorder.onstop=()=>{
        const blob=new Blob(chunks,{type:"audio/webm"});
        connections.forEach(c=>{
            if(c.open){
                c.send({type:"audio", blob});
            }
        });
    }
}
</script>

</body>
</html>
