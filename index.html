<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>CRYPT</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
body {
    margin:0;
    background:black;
    color:#0f0;
    font-family: monospace;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
    padding:10px;
    box-sizing:border-box;
}

canvas {
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:0;
}

* {
    -webkit-user-select:none;
    user-select:none;
    -webkit-tap-highlight-color: transparent;
}

.box {
    position:relative;
    z-index:1;
    width:100%;
    max-width:300px;
    background:rgba(0,0,0,0.95);
    border:2px solid #0f0;
    border-radius:12px;
    padding:12px;
    text-align:center;
    box-sizing:border-box;
}

h2 {
    margin:0 0 8px;
    font-size:18px;
}

input, button {
    width:100%;
    height:40px;
    margin:4px 0;
    padding:0 8px;
    background:#111;
    border:1.5px solid #0f0;
    color:#0f0;
    font-size:14px;
    text-align:center;
    border-radius:6px;
    box-sizing:border-box;
}

#status {
    margin-top:6px;
    font-size:11px;
    padding:3px;
}

#talk {
    width:80px;
    height:80px;
    margin:10px auto;
    border-radius:50%;
    border:none;
    cursor:pointer;
    background:radial-gradient(circle at 30% 30%, #ff4d4d, #cc0000);
    box-shadow: 0 0 20px rgba(255,0,0,0.6), inset 0 0 15px rgba(255,255,255,0.2);
    transition: transform 0.05s;
}

#talk:active {
    transform:scale(0.95);
}

.sms-area {
    margin-top:10px;
    border-top:1px solid #0f0;
    padding-top:8px;
}

.sms-box {
    background:#000;
    border:1px solid #0f0;
    border-radius:6px;
    height:100px;
    overflow-y:auto;
    padding:5px;
    margin-bottom:6px;
    text-align:left;
    font-size:11px;
}

.sms-input {
    display:flex;
    gap:5px;
}

.sms-input input {
    flex:1;
    height:35px;
    font-size:12px;
    margin:0;
    padding:0 5px;
}

.sms-input button {
    width:55px;
    height:35px;
    margin:0;
    font-size:11px;
    padding:0;
}

.msg {
    margin-bottom:4px;
    word-wrap:break-word;
}

.msg span {
    color:#ff0;
}

.msg.me {
    color:#0f0;
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div class="box">

<h2>CRYPT</h2>

<input id="room" placeholder="code">
<button onclick="joinRoom()">ENTRER</button>

<div id="status"></div>

<div class="sms-area">
    <div class="sms-box" id="smsBox"></div>
    <div class="sms-input">
        <input type="text" id="smsInput" placeholder="message">
        <button onclick="sendSMS()">OK</button>
    </div>
</div>

<button id="talk"></button>

</div>

<script>
// MATRIX
const c = document.getElementById("matrix");
const ctx = c.getContext("2d");
c.width = window.innerWidth;
c.height = window.innerHeight;

let letters = "01CRYPT".split("");
let font = 12;
let cols = Math.floor(c.width / font);
let drops = [];

for(let i = 0; i < cols; i++) drops[i] = 1;

function draw(){
    ctx.fillStyle = "rgba(0,0,0,0.05)";
    ctx.fillRect(0, 0, c.width, c.height);
    ctx.fillStyle = "#0f0";
    ctx.font = font + "px monospace";

    for(let i = 0; i < drops.length; i++){
        let text = letters[Math.floor(Math.random()*letters.length)];
        ctx.fillText(text, i * font, drops[i] * font);

        if(drops[i] * font > c.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
    }
}
setInterval(draw,33);

// VARIABLES
let localPeer;
let remotePeers = [];
let currentRoom = null;
let localStream = null;
let mediaRecorder = null;
let isPttActive = false;
let audioContext = null;

// FONCTION POUR JOUER LE SON DU TALKIE-WALKIE
function playTalkieSound(type) {
    try {
        if (!audioContext) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }
        
        const oscillator = audioContext.createOscillator();
        const gainNode = audioContext.createGain();
        
        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);
        
        if (type === 'start') {
            oscillator.frequency.value = 880;
            gainNode.gain.value = 0.3;
            oscillator.start();
            gainNode.gain.exponentialRampToValueAtTime(0.00001, audioContext.currentTime + 0.1);
            oscillator.stop(audioContext.currentTime + 0.1);
        } else if (type === 'stop') {
            oscillator.frequency.value = 440;
            gainNode.gain.value = 0.3;
            oscillator.start();
            gainNode.gain.exponentialRampToValueAtTime(0.00001, audioContext.currentTime + 0.1);
            oscillator.stop(audioContext.currentTime + 0.1);
        }
    } catch(e) {}
}

// REJOINDRE UNE COLLECTION
function joinRoom() {
    const roomInput = document.getElementById("room");
    const roomName = roomInput.value.trim();
    
    if (!roomName) return;
    
    // Fermer anciennes connexions
    if (localPeer) {
        remotePeers.forEach(conn => {
            if (conn && conn.close) conn.close();
        });
        remotePeers = [];
        localPeer.destroy();
    }
    
    currentRoom = roomName;
    
    // Créer un ID unique pour ce peer
    const randomId = Math.random().toString(36).substr(2, 8);
    localPeer = new Peer(randomId);
    
    localPeer.on('open', () => {
        document.getElementById("status").innerText = "connecté";
        
        // Stocker l'ID dans localStorage pour que les autres puissent nous trouver
        localStorage.setItem('crypt_room_' + roomName, randomId);
        
        // Chercher les autres dans la même room
        searchForPeers(roomName);
    });
    
    localPeer.on('connection', (conn) => {
        addConnection(conn);
    });
    
    localPeer.on('error', (err) => {
        document.getElementById("status").innerText = "erreur";
    });
}

// CHERCHER LES AUTRES PEERS
function searchForPeers(roomName) {
    // Récupérer tous les IDs stockés pour cette room
    const storedIds = [];
    for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key && key.startsWith('crypt_room_' + roomName)) {
            const id = localStorage.getItem(key);
            if (id && id !== localPeer.id) {
                storedIds.push(id);
            }
        }
    }
    
    // Essayer de se connecter à chaque ID trouvé
    storedIds.forEach(peerId => {
        setTimeout(() => {
            if (localPeer && peerId !== localPeer.id) {
                const conn = localPeer.connect(peerId);
                if (conn) {
                    addConnection(conn);
                }
            }
        }, 100);
    });
    
    // Mettre à jour le statut
    setTimeout(() => {
        if (remotePeers.length === 0) {
            document.getElementById("status").innerText = "seul";
        } else {
            document.getElementById("status").innerText = remotePeers.length + " connecté(s)";
        }
    }, 1000);
}

// AJOUTER UNE CONNEXION
function addConnection(conn) {
    // Éviter les doublons
    if (remotePeers.some(c => c.peer === conn.peer)) return;
    
    conn.on('open', () => {
        remotePeers.push(conn);
        document.getElementById("status").innerText = remotePeers.length + " connecté(s)";
        
        // Envoyer notre ID pour la découverte mutuelle
        conn.send({
            type: 'peer_id',
            id: localPeer.id
        });
    });
    
    conn.on('data', (data) => {
        if (data.type === 'sms') {
            addSMS("autre", data.message);
        } else if (data.type === 'audio' && data.blob) {
            playAudio(data.blob);
        } else if (data.type === 'peer_id') {
            // Stocker l'ID de l'autre peer
            localStorage.setItem('crypt_room_' + currentRoom + '_peer', data.id);
        }
    });
    
    conn.on('close', () => {
        const index = remotePeers.findIndex(c => c.peer === conn.peer);
        if (index !== -1) {
            remotePeers.splice(index, 1);
            document.getElementById("status").innerText = remotePeers.length + " connecté(s)";
        }
    });
}

// ENVOYER SMS
function sendSMS() {
    const input = document.getElementById("smsInput");
    const message = input.value.trim();
    
    if (!message || !currentRoom) return;
    
    addSMS("moi", message);
    
    remotePeers.forEach(conn => {
        if (conn.open) {
            conn.send({
                type: 'sms',
                message: message
            });
        }
    });
    
    input.value = "";
}

// AFFICHER SMS
function addSMS(sender, message) {
    const box = document.getElementById("smsBox");
    const div = document.createElement("div");
    div.className = "msg";
    if (sender === "moi") {
        div.classList.add("me");
        div.innerHTML = `<span>moi:</span> ${message}`;
    } else {
        div.innerHTML = `<span>autre:</span> ${message}`;
    }
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
}

// TALKIE-WALKIE
const talkButton = document.getElementById("talk");

talkButton.addEventListener("touchstart", startTalking);
talkButton.addEventListener("touchend", stopTalking);
talkButton.addEventListener("mousedown", startTalking);
talkButton.addEventListener("mouseup", stopTalking);

async function startTalking(e) {
    e.preventDefault();
    if (isPttActive) return;
    if (!currentRoom) return;
    
    // Jouer le son du talkie-walkie (début)
    playTalkieSound('start');
    
    try {
        if (!localStream) {
            localStream = await navigator.mediaDevices.getUserMedia({ 
                audio: {
                    echoCancellation: false,
                    noiseSuppression: false,
                    autoGainControl: false
                }
            });
        }
        
        isPttActive = true;
        mediaRecorder = new MediaRecorder(localStream, {
            mimeType: MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/mp4'
        });
        
        mediaRecorder.ondataavailable = (event) => {
            if (event.data.size > 0 && remotePeers.length > 0) {
                remotePeers.forEach(conn => {
                    if (conn.open) {
                        conn.send({
                            type: 'audio',
                            blob: event.data
                        });
                    }
                });
            }
        };
        
        mediaRecorder.start(50);
        
    } catch (err) {
        isPttActive = false;
    }
}

function stopTalking(e) {
    e.preventDefault();
    if (!isPttActive) return;
    
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
    }
    
    isPttActive = false;
    
    // Jouer le son du talkie-walkie (fin)
    playTalkieSound('stop');
}

// LIRE L'AUDIO REÇU
function playAudio(blob) {
    try {
        const audioUrl = URL.createObjectURL(blob);
        const audio = new Audio(audioUrl);
        audio.onended = () => URL.revokeObjectURL(audioUrl);
        audio.play();
    } catch (err) {}
}

// NETTOYAGE
window.addEventListener('beforeunload', () => {
    if (localPeer) {
        localPeer.destroy();
    }
    if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
    }
});
</script>

</body>
</html>
